<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Career</title><style>@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fade{animation:fade .8s cubic-bezier(.2,.7,.2,1) both}@keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(1000px)}}.sweep{animation:sweep 5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1F"/><stop offset="1" stop-color="#16204A"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/></pattern></defs>
<clipPath id="c"><rect width="1000" height="64" rx="18"/></clipPath>
<rect width="1000" height="64" rx="18" fill="url(#bg)"/>
<g clip-path="url(#c)"><rect class="sweep" x="0" y="0" width="140" height="64" fill="#6D8BFF" fill-opacity="0.12" transform="skewX(-20)"/></g>
<rect x="0.5" y="0.5" width="999" height="63" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.12"/>
<rect x="24" y="20" width="8" height="24" rx="4" fill="#E3EE5A"/>
<text x="46" y="41" font-size="24" font-weight="700" fill="#ECEFF3" letter-spacing="-0.5">Career</text>
<text x="976" y="39" text-anchor="end" font-size="14" fill="#98A2B0">Feb 2020 to present</text>
</svg>
